# RULER at 128k on Llama-3.1-8B-Instruct (native 128k window, no RoPE change): the 13 lm-eval RULER subtasks x 100.
# lm-eval sizes RULER inputs without the chat template, so at 131072 some requests would exceed the native window once
# the template is added; the *_fit tasks (lmeval_tasks/ruler_fit) are the same lm-eval tasks with budget
# 131072 - 256 = 130816 tokens, 256 reserved for the template.
suite: ruler128k
models: [llama8b_it]
modes: [bf16, "konlya:s4w128", "konlya2:s4w128:ca", "kivi2:s4w128", "kivi2id:s4w128",
        "kivi2p8ff:s4w128", "kivi2p8ffid:s4w128", "kivi2p8ffs:s4w128"]
server:
  cg_sizes: [1, 2, 4, 8, 16, 32, 64, 128, 256]
  max_model_len: 131072
  gpu_mem: 0.90
  max_num_seqs: 64
  think: 0
tasks:
  - name: ruler_128k
    kind: lmeval
    api: chat
    include_path: lmeval_tasks/ruler_fit
    tasks: [niah_single_1_fit, niah_single_2_fit, niah_single_3_fit, niah_multikey_1_fit, niah_multikey_2_fit,
            niah_multikey_3_fit, niah_multiquery_fit, niah_multivalue_fit, ruler_vt_fit, ruler_cwe_fit, ruler_fwe_fit,
            ruler_qa_squad_fit, ruler_qa_hotpot_fit]
    metadata: {max_seq_lengths: [130816]}
    limit: 100
    concurrency: 32
    gen_kwargs: "temperature=0"
